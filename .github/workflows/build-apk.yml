name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "build-bot"; git config user.email "build-bot@users.noreply.github.com"
          tail -n 300 build.log > last-build.log || echo "no log" > last-build.log
          git checkout --orphan build-logs
          git rm -rq --cached . || true
          git add last-build.log
          git commit -m "build log ${{ github.run_number }}"
          git push -f origin build-logs

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk malik.apk

      - uses: actions/upload-artifact@v4
        with:
          name: malik-apk
          path: malik.apk

      - name: Publish release (رابط تنزيل مباشر للهاتف)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: برنامج مالك ${{ github.run_number }}
          files: malik.apk
